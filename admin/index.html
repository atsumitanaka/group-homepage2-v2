<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Admin - Materials Modeling Group</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
    }
    .subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .form-card {
      background: #fff;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .field {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.4rem;
    }
    label .hint {
      font-weight: 400;
      color: #999;
      font-size: 0.75rem;
      display: block;
      margin-top: 0.15rem;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #c83c2d;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background: #c83c2d;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #a02e22; }
    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .message {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      display: none;
    }
    .message.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .message.error {
      display: block;
      background: #fbe9e7;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #888;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .back-link:hover { color: #c83c2d; }
  </style>
</head>
<body>
  <div class="container">
    <h1>News Admin</h1>
    <p class="subtitle">Materials Modeling Group - ニュース投稿フォーム</p>

    <div class="form-card">
      <form id="news-form">
        <div class="field">
          <label>
            日付
            <span class="hint">ニュースの日付を選択してください</span>
          </label>
          <input type="date" id="date" required>
        </div>

        <div class="field">
          <label>カテゴリ</label>
          <select id="category" required>
            <option value="">選択してください</option>
            <option value="お知らせ">お知らせ / Announcement</option>
            <option value="プレスリリース">プレスリリース / Press Release</option>
            <option value="受賞">受賞 / Award</option>
            <option value="メディア">メディア / Media</option>
            <option value="イベント">イベント / Event</option>
          </select>
        </div>

        <div class="field">
          <label>
            タイトル（日本語）
            <span class="hint">例: ○○研究員が△△賞を受賞</span>
          </label>
          <input type="text" id="title_ja" required>
        </div>

        <div class="field">
          <label>
            タイトル（英語）
            <span class="hint">例: Researcher XX received YY Award</span>
          </label>
          <input type="text" id="title_en" required>
        </div>

        <div class="field">
          <label>
            本文（日本語）
            <span class="hint">リンクを入れる場合: &lt;a href="URL" target="_blank"&gt;テキスト&lt;/a&gt;</span>
          </label>
          <textarea id="body_ja" required></textarea>
        </div>

        <div class="field">
          <label>
            本文（英語）
            <span class="hint">For links: &lt;a href="URL" target="_blank"&gt;text&lt;/a&gt;</span>
          </label>
          <textarea id="body_en" required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">投稿する</button>
      </form>

      <div class="message" id="message"></div>
    </div>

    <a href="../index.html" class="back-link">← ホームページに戻る</a>
  </div>

  <script>
    // ======================================================
    // Google Apps Script のデプロイURL をここに設定
    // ======================================================
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbx_u67JnXKn5Fb3tcD6fQyn1as28Im6gcgdK7Mb9UAD6V3jCS2-Qn7tJYK14P9UN6qB/exec';

    var CATEGORY_EN = {
      'お知らせ': 'Announcement',
      'プレスリリース': 'Press Release',
      '受賞': 'Award',
      'メディア': 'Media',
      'イベント': 'Event'
    };

    document.getElementById('news-form').addEventListener('submit', function(e) {
      e.preventDefault();

      if (!GAS_URL) {
        showMessage('error', 'GAS_URLが設定されていません。管理者に連絡してください。');
        return;
      }

      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '送信中...';

      var cat = document.getElementById('category').value;
      var payload = {
        date: document.getElementById('date').value,
        category: cat,
        category_en: CATEGORY_EN[cat] || cat,
        title: document.getElementById('title_ja').value,
        title_en: document.getElementById('title_en').value,
        body: document.getElementById('body_ja').value,
        body_en: document.getElementById('body_en').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(function() {
        showMessage('success', 'ニュースを投稿しました。サイトへの反映には数分かかります。');
        document.getElementById('news-form').reset();
      })
      .catch(function(err) {
        showMessage('error', '送信に失敗しました: ' + err.message);
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = '投稿する';
      });
    });

    function showMessage(type, text) {
      var el = document.getElementById('message');
      el.className = 'message ' + type;
      el.textContent = text;
    }
  </script>
</body>
</html>
